[project]
name = "dsf-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eliasdillier", email = "elias.dillier@student.unisg.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
